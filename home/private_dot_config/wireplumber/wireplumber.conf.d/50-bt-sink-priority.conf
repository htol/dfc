# Deterministic default-sink fallback for Bluetooth outputs.
# Any connected Bluetooth device must become the default sink,
# beating the always-plugged ZOOM UAC-2 (priority.session 1600).
# Manual selection still wins while the device is available
# (find-selected-default-node gives it +30000).

wireplumber.settings = {
  # Do not keep a persistent stack of previously selected devices.
  # Without this, stale entries (e.g. AirPods that are not connected)
  # shadow freshly connected ones: stored nodes get a +20000 bonus.
  node.restore-default-targets = false
}

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  }
]
