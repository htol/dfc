# Deterministic default-source fallback.
# When the EasyEffects virtual source (easyeffects_source) is absent,
# WirePlumber must pick the ZOOM UAC-2 (AKG P220 chain), never the
# Bluetooth headset microphone. Default-node scoring uses priority.session.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-ZOOM_Corporation_UAC-2_.*" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        priority.session = 500
      }
    }
  }
]
